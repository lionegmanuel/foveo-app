[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/*",
]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[profile.dev]
# Los crates de captura/render son inutilizables sin optimizacion (frame drops).
# opt-level bajo en dev general, pero se puede subir por-crate si hace falta.
opt-level = 1

[profile.release]
opt-level = 3
lto = true
